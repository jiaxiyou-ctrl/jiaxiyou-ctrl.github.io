<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="624" viewBox="0 0 1280 624" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Phase-conditioned action semantics for needle control</title>
  <desc id="figure-description">A shared encoder and the head selected by task phase produce a five-dimensional action proposal. Three rows compare alignment, guarded entry, and insertion. Filled circles indicate enabled channels; outlined circles indicate channels set to zero. Alignment permits position and orientation correction. Entry permits only axial feed with a positive lower bound. Insertion limits axial feed using remaining depth and stops forward motion in the terminal region. The right-hand geometric sketches show the corresponding motion. Rows depict alternative phases, not simultaneous controllers. Proposal values and channel order are schematic. Terminal regulation is part of proposal generation and is omitted from the compact network drawing.</desc>
  <defs>
    <style>
      text{font-family:'Avenir Next',Avenir,Arial,sans-serif;fill:#353431;font-size:20px;font-weight:400}
      .heading{font-size:23px;font-weight:500}
      .subheading{font-size:18px;fill:#6f6c66}
      .phase-name{font-size:22px;font-weight:500}
      .note{font-size:17px;fill:#6f6c66}
      .math{font-family:'Iowan Old Style',Georgia,serif;font-size:23px;font-style:italic}
      .rule{fill:none;stroke:#dedbd5;stroke-width:1}
      .wire{fill:none;stroke:#66635e;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
      .ink-line{fill:none;stroke:#353431;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .accent-line{fill:none;stroke:#536b79;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
      .guide{fill:none;stroke:#85817a;stroke-width:1.4;stroke-dasharray:5 5}
      .active{fill:#536b79;stroke:#536b79;stroke-width:1.5}
      .inactive{fill:#faf9f6;stroke:#77736d;stroke-width:1.5}
      .head{fill:#faf9f6;stroke:#77736d;stroke-width:1.4}
      .range{fill:none;stroke:#536b79;stroke-width:4;stroke-linecap:round}
      .vector-mark{fill:none;stroke:#66635e;stroke-width:2.4;stroke-linecap:round}
    </style>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 8 4 0 8Z" fill="#66635e"/></marker>
    <marker id="motion-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 8 4 0 8Z" fill="#536b79"/></marker>
    <g id="proposal-frame"><path class="wire" d="M315-24h-5v48h5M338-24h5v48h-5"/></g>
    <g id="one-channel">
      <circle class="active" cx="420" cy="0" r="8"/>
      <circle class="inactive" cx="452" cy="0" r="8"/>
      <circle class="inactive" cx="484" cy="0" r="8"/>
      <circle class="inactive" cx="516" cy="0" r="8"/>
      <circle class="inactive" cx="548" cy="0" r="8"/>
    </g>
  </defs>

  <rect width="1280" height="624" fill="#faf9f6"/>

  <!-- One hierarchy, no enclosing module cards. -->
  <text class="heading" x="32" y="43">Learned proposal</text>
  <text class="heading" x="406" y="43">Phase-conditioned execution</text>
  <text class="heading" x="964" y="43">Task-space motion</text>
  <path class="rule" d="M32 68H1248"/>
  <text class="subheading" x="32" y="99">One head selected per phase</text>
  <text class="subheading" x="484" y="99" text-anchor="middle">Enabled channels</text>
  <text class="subheading" x="734" y="99" text-anchor="middle">Motion bounds</text>
  <text class="subheading" x="1092" y="99" text-anchor="middle">Physical decoding</text>
  <text class="note" x="326" y="147" text-anchor="middle">5-D</text>

  <!-- Shared representation; the three displayed heads are alternatives. -->
  <text x="32" y="350">State</text>
  <path class="wire" d="M84 342H108" marker-end="url(#arrow)"/>
  <text class="subheading" x="159" y="306" text-anchor="middle">Shared</text>
  <rect class="head" x="112" y="317" width="94" height="50" rx="2"/>
  <text x="159" y="350" text-anchor="middle">encoder</text>
  <path class="wire" d="M206 342H227M227 194V490"/>
  <path class="wire" d="M227 194H249" marker-end="url(#arrow)"/>
  <path class="wire" d="M227 342H249" marker-end="url(#arrow)"/>
  <path class="wire" d="M227 490H249" marker-end="url(#arrow)"/>
  <g id="phase-heads" text-anchor="middle">
    <rect class="head" x="251" y="177" width="41" height="34" rx="2"/>
    <text x="271.5" y="201">A</text>
    <rect class="head" x="251" y="325" width="41" height="34" rx="2"/>
    <text x="271.5" y="349">A2</text>
    <rect class="head" x="251" y="473" width="41" height="34" rx="2"/>
    <text x="271.5" y="497">B</text>
  </g>

  <!-- Bracketed proposals are illustrative values, not an action mask. -->
  <g id="alignment-proposal" transform="translate(0 194)">
    <use href="#proposal-frame"/>
    <path class="vector-mark" d="M320-16h10M320-8h16M320 0h7M320 8h13M320 16h9"/>
    <path class="wire" d="M352 0H396" marker-end="url(#arrow)"/>
  </g>
  <g id="entry-proposal" transform="translate(0 342)">
    <use href="#proposal-frame"/>
    <path class="vector-mark" d="M320-16h15M320-8h6M320 0h11M320 8h8M320 16h13"/>
    <path class="wire" d="M352 0H396" marker-end="url(#arrow)"/>
  </g>
  <g id="insertion-proposal" transform="translate(0 490)">
    <use href="#proposal-frame"/>
    <path class="vector-mark" d="M320-16h8M320-8h12M320 0h6M320 8h15M320 16h10"/>
    <path class="wire" d="M352 0H396" marker-end="url(#arrow)"/>
  </g>
  <path class="wire" d="M292 194H305M292 342H305M292 490H305"/>

  <!-- Phase A: all five channels remain enabled, with signed bounds. -->
  <text class="phase-name" x="406" y="150">Alignment</text>
  <g id="alignment-mask" transform="translate(0 194)">
    <circle class="active" cx="420" cy="0" r="8"/>
    <circle class="active" cx="452" cy="0" r="8"/>
    <circle class="active" cx="484" cy="0" r="8"/>
    <circle class="active" cx="516" cy="0" r="8"/>
    <circle class="active" cx="548" cy="0" r="8"/>
  </g>
  <path class="wire" d="M577 194H625" marker-end="url(#arrow)"/>
  <path class="range" d="M650 194H818"/>
  <path class="wire" d="M650 187V201M734 189V199M818 187V201"/>
  <text class="note" x="650" y="223" text-anchor="middle">−</text>
  <text class="note" x="734" y="223" text-anchor="middle">0</text>
  <text class="note" x="818" y="223" text-anchor="middle">+</text>
  <text x="734" y="252" text-anchor="middle">Signed corrections</text>
  <path class="wire" d="M852 194H930" marker-end="url(#arrow)"/>
  <g id="alignment-motion" transform="translate(1090 187)">
    <path class="ink-line" d="M-62-32 3 18"/>
    <path class="accent-line" d="M-8 18H71" marker-start="url(#motion-arrow)" marker-end="url(#motion-arrow)"/>
    <path class="accent-line" d="M33-22V52" marker-start="url(#motion-arrow)" marker-end="url(#motion-arrow)"/>
    <path class="accent-line" d="M-79 1A49 49 0 0 1-37-55" marker-end="url(#motion-arrow)"/>
  </g>
  <text x="1092" y="252" text-anchor="middle">Position + orientation</text>
  <path class="rule" d="M406 273H1248"/>

  <!-- Phase A2: a single axial progress coordinate with a positive lower bound. -->
  <text class="phase-name" x="406" y="298">Entry</text>
  <g id="entry-mask" transform="translate(0 342)"><use href="#one-channel"/></g>
  <path class="wire" d="M577 342H625" marker-end="url(#arrow)"/>
  <path class="guide" d="M650 342H690"/>
  <path class="range" d="M690 342H818"/>
  <path class="wire" d="M650 335V349M690 335V349M818 335V349"/>
  <text class="note" x="650" y="371" text-anchor="middle">0</text>
  <text class="math" x="690" y="371" text-anchor="middle">f<tspan font-size="15" dy="4">min</tspan></text>
  <text x="734" y="400" text-anchor="middle">Minimum advance</text>
  <path class="wire" d="M852 342H930" marker-end="url(#arrow)"/>
  <g id="entry-motion">
    <path class="guide" d="M972 342H1213"/>
    <path class="ink-line" d="M982 342H1082"/>
    <path class="accent-line" d="M1094 342H1171" marker-end="url(#motion-arrow)"/>
  </g>
  <text x="1092" y="400" text-anchor="middle">Locked-axis advance</text>
  <path class="rule" d="M406 421H1248"/>

  <!-- Phase B: remaining depth caps feed; the terminal region stops forward motion. -->
  <text class="phase-name" x="406" y="446">Insertion</text>
  <g id="insertion-mask" transform="translate(0 490)"><use href="#one-channel"/></g>
  <path class="wire" d="M577 490H625" marker-end="url(#arrow)"/>
  <path class="guide" d="M722 490H818"/>
  <path class="range" d="M650 490H722"/>
  <path class="wire" d="M650 483V497M722 483V497"/>
  <text class="note" x="650" y="519" text-anchor="middle">0</text>
  <text class="math" x="747" y="519" text-anchor="middle">f<tspan font-size="15" dy="4">max</tspan><tspan dy="-4">(d)</tspan></text>
  <text x="734" y="548" text-anchor="middle">Remaining-depth cap</text>
  <path class="wire" d="M852 490H930" marker-end="url(#arrow)"/>
  <g id="insertion-motion">
    <path class="guide" d="M972 490H1220"/>
    <path class="ink-line" d="M1044 490H1152"/>
    <path class="accent-line" d="M1160 490H1178" marker-end="url(#motion-arrow)"/>
    <path class="wire" d="M1185 467V513M1199 467V513"/>
    <path class="ink-line" d="M1185 490H1199M1192 483V497"/>
  </g>
  <text x="1092" y="548" text-anchor="middle">Terminal stop band</text>

  <!-- Redundant fill encoding makes the channel comparison work in grayscale. -->
  <path class="rule" d="M32 578H1248"/>
  <circle class="active" cx="41" cy="602" r="6"/>
  <text class="note" x="57" y="608">Enabled</text>
  <circle class="inactive" cx="168" cy="602" r="6"/>
  <text class="note" x="184" y="608">Zeroed</text>
  <text class="note" x="1248" y="608" text-anchor="end">Phase from task logic · d: remaining depth · channel order schematic</text>
</svg>
